<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tetra Blocks Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      background: #0f172a;
      padding: 16px;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .canvas-wrap {
      position: relative;
    }
    canvas#board {
      background: #050811;
      border: 1px solid #1e293b;
      border-radius: 6px;
      display: block;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 110px;
    }
    .box {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .box-title {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
    }
    .box-val {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
    }
    canvas.preview {
      display: block;
      margin: 0 auto;
      background: transparent;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 17, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 6px;
    }
    .overlay h2 { font-size: 20px; font-weight: 700; color: #f8fafc; }
    .overlay p { font-size: 12px; color: #94a3b8; text-align: center; padding: 0 8px; }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #2563eb; }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="sidebar">
      <div class="box">
        <div class="box-title">HOLD (C)</div>
        <canvas id="hold" class="preview" width="80" height="60"></canvas>
      </div>
      <div class="box">
        <div class="box-title">SCORE</div>
        <div class="box-val" id="score">0</div>
      </div>
      <div class="box">
        <div class="box-title">LINES</div>
        <div class="box-val" id="lines">0</div>
      </div>
      <div class="box">
        <div class="box-title">LEVEL</div>
        <div class="box-val" id="level">1</div>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="board" width="200" height="400"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="ov-title">TETRA BLOCKS</h2>
        <p id="ov-desc">Left/Right: Move · Up: Rotate · Space: Hard Drop</p>
        <button class="btn" id="start-btn">START</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="box">
        <div class="box-title">NEXT</div>
        <canvas id="next" class="preview" width="80" height="60"></canvas>
      </div>
      <div class="box" style="margin-top: auto;">
        <button class="btn" style="width: 100%; padding: 6px;" id="pause-btn">PAUSE</button>
      </div>
    </div>
  </div>

  <div class="hint">Arrows / WASD · Up/W to Rotate · Space: Hard Drop · C: Hold</div>

  <script>
    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 20;
    const board = document.getElementById('board');
    const ctx = board.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');
    const holdCanvas = document.getElementById('hold');
    const holdCtx = holdCanvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const levelEl = document.getElementById('level');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovDesc = document.getElementById('ov-desc');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');

    const SHAPES = {
      I: { color: '#06b6d4', matrix: [[1, 1, 1, 1]] },
      J: { color: '#3b82f6', matrix: [[1, 0, 0], [1, 1, 1]] },
      L: { color: '#f97316', matrix: [[0, 0, 1], [1, 1, 1]] },
      O: { color: '#eab308', matrix: [[1, 1], [1, 1]] },
      S: { color: '#22c55e', matrix: [[0, 1, 1], [1, 1, 0]] },
      T: { color: '#a855f7', matrix: [[0, 1, 0], [1, 1, 1]] },
      Z: { color: '#ef4444', matrix: [[1, 1, 0], [0, 1, 1]] }
    };
    const KEYS = Object.keys(SHAPES);

    let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let current = null;
    let nextPiece = null;
    let holdPiece = null;
    let canHold = true;
    let score = 0;
    let lines = 0;
    let level = 1;
    let dropInterval = 800;
    let lastDrop = 0;
    let state = 'MENU'; // 'MENU' | 'PLAY' | 'OVER' | 'PAUSED'

    function randomPiece() {
      const type = KEYS[Math.floor(Math.random() * KEYS.length)];
      return {
        type,
        color: SHAPES[type].color,
        matrix: SHAPES[type].matrix.map(row => [...row]),
        x: Math.floor(COLS / 2) - Math.ceil(SHAPES[type].matrix[0].length / 2),
        y: 0
      };
    }

    function rotate(matrix) {
      const N = matrix.length;
      const M = matrix[0].length;
      const res = Array.from({ length: M }, () => Array(N).fill(0));
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < M; c++) {
          res[c][N - 1 - r] = matrix[r][c];
        }
      }
      return res;
    }

    function collide(piece, ox = 0, oy = 0, mat = piece.matrix) {
      for (let r = 0; r < mat.length; r++) {
        for (let c = 0; c < mat[r].length; c++) {
          if (mat[r][c]) {
            const x = piece.x + c + ox;
            const y = piece.y + r + oy;
            if (x < 0 || x >= COLS || y >= ROWS) return true;
            if (y >= 0 && grid[y][x]) return true;
          }
        }
      }
      return false;
    }

    function lock() {
      current.matrix.forEach((row, r) => {
        row.forEach((val, c) => {
          if (val) {
            const y = current.y + r;
            const x = current.x + c;
            if (y >= 0) grid[y][x] = current.color;
          }
        });
      });

      // Clear full lines
      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(c => c !== 0)) {
          grid.splice(r, 1);
          grid.unshift(Array(COLS).fill(0));
          cleared++;
          r++;
        }
      }

      if (cleared > 0) {
        lines += cleared;
        const lineScores = [0, 100, 300, 500, 800];
        score += (lineScores[cleared] || 1000) * level;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(120, 800 - (level - 1) * 70);
        scoreEl.textContent = score;
        linesEl.textContent = lines;
        levelEl.textContent = level;
      }

      canHold = true;
      current = nextPiece;
      nextPiece = randomPiece();
      drawPreview(nextCtx, nextPiece);

      if (collide(current)) {
        gameOver();
      }
    }

    function drawPreview(pCtx, piece) {
      pCtx.clearRect(0, 0, 80, 60);
      if (!piece) return;
      const mat = piece.matrix;
      const bSize = 14;
      const ox = (80 - mat[0].length * bSize) / 2;
      const oy = (60 - mat.length * bSize) / 2;
      pCtx.fillStyle = piece.color;
      mat.forEach((row, r) => {
        row.forEach((val, c) => {
          if (val) {
            pCtx.fillRect(ox + c * bSize, oy + r * bSize, bSize - 1, bSize - 1);
          }
        });
      });
    }

    function hardDrop() {
      while (!collide(current, 0, 1)) {
        current.y++;
        score += 2;
      }
      scoreEl.textContent = score;
      lock();
    }

    function hold() {
      if (!canHold) return;
      canHold = false;
      const temp = current.type;
      if (holdPiece) {
        current = {
          type: holdPiece,
          color: SHAPES[holdPiece].color,
          matrix: SHAPES[holdPiece].matrix.map(row => [...row]),
          x: Math.floor(COLS / 2) - 1,
          y: 0
        };
      } else {
        current = nextPiece;
        nextPiece = randomPiece();
        drawPreview(nextCtx, nextPiece);
      }
      holdPiece = temp;
      drawPreview(holdCtx, { color: SHAPES[holdPiece].color, matrix: SHAPES[holdPiece].matrix });
    }

    function start() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      score = 0; lines = 0; level = 1;
      dropInterval = 800;
      scoreEl.textContent = '0';
      linesEl.textContent = '0';
      levelEl.textContent = '1';
      holdPiece = null;
      canHold = true;
      holdCtx.clearRect(0, 0, 80, 60);

      current = randomPiece();
      nextPiece = randomPiece();
      drawPreview(nextCtx, nextPiece);

      state = 'PLAY';
      overlay.style.display = 'none';
      requestAnimationFrame(loop);
    }

    function gameOver() {
      state = 'OVER';
      ovTitle.textContent = 'GAME OVER';
      ovDesc.textContent = `Lines: ${lines} · Final Score: ${score}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.style.display = 'flex';
    }

    function draw() {
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, board.width, board.height);

      // Grid lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath(); ctx.moveTo(0, r * BLOCK); ctx.lineTo(board.width, r * BLOCK); ctx.stroke();
      }
      for (let c = 0; c <= COLS; c++) {
        ctx.beginPath(); ctx.moveTo(c * BLOCK, 0); ctx.lineTo(c * BLOCK, board.height); ctx.stroke();
      }

      // Placed blocks
      grid.forEach((row, r) => {
        row.forEach((val, c) => {
          if (val) {
            ctx.fillStyle = val;
            ctx.fillRect(c * BLOCK + 1, r * BLOCK + 1, BLOCK - 2, BLOCK - 2);
          }
        });
      });

      // Ghost piece
      if (current && state === 'PLAY') {
        let ghostY = current.y;
        while (!collide(current, 0, ghostY - current.y + 1)) {
          ghostY++;
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        current.matrix.forEach((row, r) => {
          row.forEach((val, c) => {
            if (val) {
              ctx.strokeRect((current.x + c) * BLOCK + 2, (ghostY + r) * BLOCK + 2, BLOCK - 4, BLOCK - 4);
            }
          });
        });

        // Current piece
        ctx.fillStyle = current.color;
        current.matrix.forEach((row, r) => {
          row.forEach((val, c) => {
            if (val) {
              ctx.fillRect((current.x + c) * BLOCK + 1, (current.y + r) * BLOCK + 1, BLOCK - 2, BLOCK - 2);
            }
          });
        });
      }
    }

    function loop(time) {
      if (state !== 'PLAY') return;
      if (time - lastDrop > dropInterval) {
        lastDrop = time;
        if (!collide(current, 0, 1)) {
          current.y++;
        } else {
          lock();
        }
      }
      draw();
      if (state === 'PLAY') requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
      if (state === 'MENU' || state === 'OVER') {
        if (e.key === ' ' || e.key === 'Enter') start();
        return;
      }
      if (e.key === 'p' || e.key === 'P') {
        togglePause();
        return;
      }
      if (state !== 'PLAY') return;

      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        if (!collide(current, -1, 0)) current.x--;
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        if (!collide(current, 1, 0)) current.x++;
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        if (!collide(current, 0, 1)) { current.y++; score += 1; scoreEl.textContent = score; }
      } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        const rotated = rotate(current.matrix);
        if (!collide(current, 0, 0, rotated)) {
          current.matrix = rotated;
        } else if (!collide(current, -1, 0, rotated)) {
          current.matrix = rotated; current.x--;
        } else if (!collide(current, 1, 0, rotated)) {
          current.matrix = rotated; current.x++;
        }
      } else if (e.key === ' ') {
        hardDrop();
      } else if (e.key === 'c' || e.key === 'C') {
        hold();
      }
      draw();
    });

    function togglePause() {
      if (state === 'PLAY') {
        state = 'PAUSED';
        ovTitle.textContent = 'PAUSED';
        ovDesc.textContent = 'Press P or Resume to continue';
        startBtn.textContent = 'RESUME';
        overlay.style.display = 'flex';
      } else if (state === 'PAUSED') {
        state = 'PLAY';
        overlay.style.display = 'none';
        requestAnimationFrame(loop);
      }
    }

    pauseBtn.addEventListener('click', togglePause);
    startBtn.addEventListener('click', () => {
      if (state === 'PAUSED') togglePause();
      else start();
    });

    draw();
  </script>
</body>
</html>
