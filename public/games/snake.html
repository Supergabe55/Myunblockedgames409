<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Classic Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 440px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .hud span { color: #38bdf8; }
    .hud .best { color: #f59e0b; }
    #canvas-container {
      position: relative;
      border: 2px solid #1e293b;
      border-radius: 12px;
      background: #0f172a;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #0b1120;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 17, 32, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .overlay h2 {
      font-size: 24px;
      font-weight: 700;
      color: #f8fafc;
    }
    .overlay p {
      font-size: 13px;
      color: #94a3b8;
    }
    .btn {
      margin-top: 6px;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #2563eb; }
    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span class="best" id="best">0</span></div>
  </div>

  <div id="canvas-container">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title">SNAKE ARCADE</h2>
      <p id="overlay-desc">Use Arrow Keys or WASD to Move</p>
      <button class="btn" id="start-btn">PLAY NOW</button>
    </div>
  </div>

  <div class="controls-hint">Arrow Keys / WASD · Space to Pause</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const startBtn = document.getElementById('start-btn');

    const GRID = 20;
    const COLS = 20;
    const ROWS = 20;

    let snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 10 };
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_highscore') || '0', 10);
    bestEl.textContent = best;
    let state = 'MENU'; // 'MENU' | 'PLAY' | 'OVER' | 'PAUSED'
    let lastTick = 0;
    let speed = 110; // ms per frame

    // Audio synthesizer
    const audioCtx = window.AudioContext ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function playBeep(freq, type = 'sine', duration = 0.08) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function startGame() {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speed = 110;
      scoreEl.textContent = score;
      spawnFood();
      state = 'PLAY';
      overlay.style.display = 'none';
      requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      state = 'OVER';
      playBeep(140, 'sawtooth', 0.25);
      if (score > best) {
        best = score;
        localStorage.setItem('snake_highscore', best);
        bestEl.textContent = best;
      }
      overlayTitle.textContent = 'GAME OVER';
      overlayDesc.textContent = `Score: ${score} · Best: ${best}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.style.display = 'flex';
    }

    function update() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return gameOver();
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        playBeep(480, 'sine', 0.1);
        spawnFood();
        if (speed > 60) speed -= 1.5;
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Background grid
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= canvas.width; x += GRID) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += GRID) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Draw food (apple glow)
      ctx.save();
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Draw snake
      snake.forEach((seg, index) => {
        const isHead = index === 0;
        ctx.fillStyle = isHead ? '#38bdf8' : '#0284c7';
        const r = isHead ? 6 : 4;
        const px = seg.x * GRID + 1;
        const py = seg.y * GRID + 1;
        const sz = GRID - 2;

        ctx.beginPath();
        ctx.roundRect(px, py, sz, sz, r);
        ctx.fill();

        if (isHead) {
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(px + sz * 0.35, py + sz * 0.35, 2, 0, Math.PI * 2);
          ctx.arc(px + sz * 0.65, py + sz * 0.35, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function gameLoop(timestamp) {
      if (state !== 'PLAY') return;
      if (timestamp - lastTick >= speed) {
        lastTick = timestamp;
        update();
        draw();
      }
      if (state === 'PLAY') {
        requestAnimationFrame(gameLoop);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      if (state === 'MENU' || state === 'OVER') {
        if (e.key === ' ' || e.key === 'Enter') startGame();
        return;
      }
      if (e.key === ' ') {
        if (state === 'PLAY') {
          state = 'PAUSED';
          overlayTitle.textContent = 'PAUSED';
          overlayDesc.textContent = 'Press Space to Resume';
          startBtn.textContent = 'RESUME';
          overlay.style.display = 'flex';
        } else if (state === 'PAUSED') {
          state = 'PLAY';
          overlay.style.display = 'none';
          requestAnimationFrame(gameLoop);
        }
        return;
      }

      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && dir.y === 0) {
        nextDir = { x: 0, y: -1 };
      } else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && dir.y === 0) {
        nextDir = { x: 0, y: 1 };
      } else if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && dir.x === 0) {
        nextDir = { x: -1, y: 0 };
      } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && dir.x === 0) {
        nextDir = { x: 1, y: 0 };
      }
    });

    startBtn.addEventListener('click', () => {
      if (state === 'PAUSED') {
        state = 'PLAY';
        overlay.style.display = 'none';
        requestAnimationFrame(gameLoop);
      } else {
        startGame();
      }
    });

    draw();
  </script>
</body>
</html>
