<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minesweeper Retro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .window {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 2px inset #334155;
      padding: 6px 12px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .digital {
      background: #000;
      color: #ef4444;
      font-family: 'Courier New', Courier, monospace;
      font-size: 20px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 2px;
    }
    .face-btn {
      font-size: 22px;
      background: #334155;
      border: 2px outset #475569;
      border-radius: 6px;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face-btn:active {
      border-style: inset;
    }
    .diff-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      justify-content: center;
    }
    .diff-btn {
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .diff-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }
    .grid {
      display: grid;
      gap: 2px;
      background: #0f172a;
      border: 2px inset #334155;
      padding: 4px;
      border-radius: 6px;
    }
    .cell {
      width: 28px;
      height: 28px;
      background: #334155;
      border: 2px outset #475569;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .cell.revealed {
      background: #0f172a;
      border: 1px solid #1e293b;
      cursor: default;
    }
    .cell.mine {
      background: #ef4444;
      border-color: #dc2626;
    }
    .cell.c1 { color: #38bdf8; }
    .cell.c2 { color: #22c55e; }
    .cell.c3 { color: #ef4444; }
    .cell.c4 { color: #8b5cf6; }
    .cell.c5 { color: #f59e0b; }
    .cell.c6 { color: #06b6d4; }
    .cell.c7 { color: #ec4899; }
    .cell.c8 { color: #94a3b8; }

    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="diff-bar">
    <button class="diff-btn active" data-mode="easy">Beginner (9x9)</button>
    <button class="diff-btn" data-mode="med">Intermediate (12x12)</button>
  </div>

  <div class="window">
    <div class="top-bar">
      <div class="digital" id="mines-left">010</div>
      <button class="face-btn" id="face">🙂</button>
      <div class="digital" id="timer">000</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="hint">Left Click to Dig · Right Click or Long Press to Flag 🚩</div>

  <script>
    const gridEl = document.getElementById('grid');
    const minesLeftEl = document.getElementById('mines-left');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('face');
    const diffBtns = document.querySelectorAll('.diff-btn');

    let rows = 9;
    let cols = 9;
    let totalMines = 10;
    let board = [];
    let state = 'WAIT'; // 'WAIT' | 'PLAY' | 'WON' | 'LOST'
    let timer = 0;
    let timerInterval = null;
    let flags = 0;

    diffBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        diffBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (btn.dataset.mode === 'easy') {
          rows = 9; cols = 9; totalMines = 10;
        } else {
          rows = 12; cols = 12; totalMines = 20;
        }
        init();
      });
    });

    function init() {
      clearInterval(timerInterval);
      timer = 0;
      flags = 0;
      state = 'WAIT';
      timerEl.textContent = '000';
      faceBtn.textContent = '🙂';
      updateMinesLeft();

      gridEl.style.gridTemplateColumns = `repeat(${cols}, 28px)`;
      board = [];
      gridEl.innerHTML = '';

      for (let r = 0; r < rows; r++) {
        board[r] = [];
        for (let c = 0; c < cols; c++) {
          const cellEl = document.createElement('div');
          cellEl.className = 'cell';
          cellEl.dataset.r = r;
          cellEl.dataset.c = c;
          gridEl.appendChild(cellEl);

          board[r][c] = {
            r, c,
            mine: false,
            revealed: false,
            flagged: false,
            count: 0,
            el: cellEl
          };

          cellEl.addEventListener('click', () => handleClick(r, c));
          cellEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handleRightClick(r, c);
          });
        }
      }
    }

    function plantMines(safeR, safeC) {
      let planted = 0;
      while (planted < totalMines) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        if ((r === safeR && c === safeC) || board[r][c].mine) continue;
        board[r][c].mine = true;
        planted++;
      }

      // Count neighbors
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c].mine) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].mine) {
                count++;
              }
            }
          }
          board[r][c].count = count;
        }
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timer = Math.min(999, timer + 1);
        timerEl.textContent = String(timer).padStart(3, '0');
      }, 1000);
    }

    function updateMinesLeft() {
      const left = totalMines - flags;
      minesLeftEl.textContent = String(Math.max(-99, Math.min(999, left))).padStart(3, '0');
    }

    function handleClick(r, c) {
      if (state === 'WON' || state === 'LOST') return;
      const cell = board[r][c];
      if (cell.flagged || cell.revealed) return;

      if (state === 'WAIT') {
        state = 'PLAY';
        plantMines(r, c);
        startTimer();
      }

      reveal(r, c);

      if (cell.mine) {
        gameOver(false);
      } else {
        checkWin();
      }
    }

    function handleRightClick(r, c) {
      if (state === 'WON' || state === 'LOST') return;
      const cell = board[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      cell.el.textContent = cell.flagged ? '🚩' : '';
      flags += cell.flagged ? 1 : -1;
      updateMinesLeft();
    }

    function reveal(r, c) {
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;

      cell.revealed = true;
      cell.el.classList.add('revealed');

      if (cell.mine) {
        cell.el.classList.add('mine');
        cell.el.textContent = '💣';
        return;
      }

      if (cell.count > 0) {
        cell.el.textContent = cell.count;
        cell.el.classList.add(`c${cell.count}`);
      } else {
        // Cascade open
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
              reveal(nr, nc);
            }
          }
        }
      }
    }

    function checkWin() {
      let revealedSafe = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c].revealed && !board[r][c].mine) revealedSafe++;
        }
      }
      if (revealedSafe === (rows * cols) - totalMines) {
        gameOver(true);
      }
    }

    function gameOver(won) {
      clearInterval(timerInterval);
      state = won ? 'WON' : 'LOST';
      faceBtn.textContent = won ? '😎' : '😵';

      // Reveal all mines
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = board[r][c];
          if (cell.mine) {
            cell.el.classList.add('revealed');
            if (!cell.flagged) {
              cell.el.textContent = '💣';
              if (!won) cell.el.classList.add('mine');
            }
          }
        }
      }
    }

    faceBtn.addEventListener('click', init);
    init();
  </script>
</body>
</html>
